<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 건강기록 관리 시스템</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:linear-gradient(135deg,#dbeafe,#eff6ff); min-height:100vh; padding:30px; }
.container { max-width:1200px; margin:auto; }
.title { text-align:center; color:#1e40af; margin-bottom:30px; }
.card { background:white; border-radius:20px; padding:25px; margin-bottom:20px; box-shadow:0 10px 25px rgba(0,0,0,.08); }
h2 { margin-bottom:15px; color:#1e3a8a; }
input, textarea { width:100%; padding:12px; margin:8px 0; border:1px solid #d1d5db; border-radius:10px; }
textarea { resize:none; height:120px; }
button { padding:12px 20px; border:none; border-radius:10px; background:#2563eb; color:white; cursor:pointer; margin:5px; }
button:hover { background:#1d4ed8; }
button:disabled { background:#93c5fd; cursor:not-allowed; }
.btn-group { display:flex; gap:10px; flex-wrap:wrap; }
.profile-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; }
.info-box { background:#f8fafc; padding:15px; border-radius:12px; }
#historyList { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:15px; margin-top:15px; }
.history-card { background:#f8fafc; border-radius:15px; padding:15px; }
#aiResult { background:#f8fafc; padding:15px; border-radius:12px; min-height:100px; white-space:pre-wrap; line-height:1.7; }
.ai-loading { display:none; align-items:center; gap:10px; color:#6b7280; margin-top:10px; }
.ai-loading.show { display:flex; }
.spinner { width:20px; height:20px; border:3px solid #dbeafe; border-top:3px solid #2563eb; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ai-btn-group { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.ai-btn-group button { background:#2563eb; }
.ai-btn-group button.secondary { background:#7c3aed; }
.ai-btn-group button.secondary:hover { background:#6d28d9; }
.ai-btn-group button.success { background:#059669; }
.ai-btn-group button.success:hover { background:#047857; }
.ai-btn-group button.warning { background:#d97706; }
.ai-btn-group button.warning:hover { background:#b45309; }
.custom-question { display:flex; gap:8px; margin-top:10px; }
.custom-question input { margin:0; flex:1; }
.custom-question button { white-space:nowrap; }
</style>
</head>
<body>
<div class="container">

  <h1 class="title">🏥 AI 건강기록 관리 시스템</h1>

  <!-- 로그인 -->
  <div class="card">
    <h2>🔐 로그인</h2>
    <input type="email" id="email" placeholder="이메일">
    <input type="password" id="password" placeholder="비밀번호">
    <div class="btn-group">
      <button id="signupBtn">회원가입</button>
      <button id="loginBtn">로그인</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
    <p id="userInfo" style="margin-top:10px;color:#6b7280;">로그인되지 않음</p>
  </div>

  <!-- 내 정보 -->
  <div class="card">
    <h2>👤 내 정보</h2>
    <div class="profile-grid">
      <div class="info-box"><strong>사용자</strong><p id="userName">사용자 정보</p></div>
      <div class="info-box"><strong>총 방문 횟수</strong><p id="visitCount">0회</p></div>
      <div class="info-box"><strong>최근 방문일</strong><p id="recentVisit">없음</p></div>
    </div>
  </div>

  <!-- 병력 등록 -->
  <div class="card">
    <h2>➕ 병력 등록</h2>
    <input type="date" id="date">
    <input type="text" id="disease" placeholder="병명">
    <textarea id="symptom" placeholder="증상 입력"></textarea>
    <input type="text" id="prescription" placeholder="처방 내용">
    <input type="text" id="hospital" placeholder="병원명">
    <button id="saveBtn">저장하기</button>
  </div>

  <!-- 병력 목록 -->
  <div class="card">
    <h2>📋 내 병력</h2>
    <button id="loadBtn">병력 불러오기</button>
    <div id="historyList"></div>
  </div>

  <!-- AI 분석 -->
  <div class="card">
    <h2>🤖 AI 건강 분석</h2>

    <div class="ai-btn-group">
      <button id="analyzeBtn">📋 종합 병력 분석</button>
      <button id="adviceBtn" class="secondary">💡 건강 관리 조언</button>
      <button id="symptomBtn" class="success">🩺 증상 주의사항</button>
      <button id="checkupBtn" class="warning">🔬 검진 권고사항</button>
    </div>

    <div class="custom-question">
      <input type="text" id="customQ" placeholder="궁금한 점을 직접 입력하세요 (예: 고혈압과 당뇨를 함께 관리하는 방법은?)">
      <button id="customBtn">질문하기</button>
    </div>

    <div class="ai-loading" id="aiLoading">
      <div class="spinner"></div>
      <span id="loadingText">AI가 분석 중입니다...</span>
    </div>

    <div id="aiResult" style="margin-top:12px;">AI 분석 결과가 여기에 표시됩니다.</div>

    <div class="btn-group" style="margin-top:10px;">
      <button id="ttsBtn">🔊 읽어주기</button>
      <button id="stopTtsBtn">⏹ 멈추기</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo_ux68hyhyfbLivMv7FLBHNafo8AEizQ",
  authDomain: "test-7b0db.firebaseapp.com",
  databaseURL: "https://test-7b0db-default-rtdb.firebaseio.com",
  projectId: "test-7b0db",
  storageBucket: "test-7b0db.firebasestorage.app",
  messagingSenderId: "895251219254",
  appId: "1:895251219254:web:1dc67dff22de53642c6997",
  measurementId: "G-JCYBBY8H7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const GAS_URL = "https://script.google.com/macros/s/AKfycbzCVBk5GjI7qiveH0YVT7g6sCnPrqqbslA1uNTlyR7rB-dvZLnSa2wWg5i0-EmnFG57/exec";

// ── Apps Script 통해 OpenAI 호출 ──
async function askAI(question) {
  const loading = document.getElementById("aiLoading");
  const resultBox = document.getElementById("aiResult");
  const btns = document.querySelectorAll(".ai-btn-group button, .custom-question button");

  loading.classList.add("show");
  resultBox.innerText = "";
  btns.forEach(b => b.disabled = true);

  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    resultBox.innerText = data.answer;
  } catch (err) {
    resultBox.innerText = "❌ 오류가 발생했습니다: " + err.message;
  } finally {
    loading.classList.remove("show");
    btns.forEach(b => b.disabled = false);
  }
}

// ── 병력 카드에서 데이터 수집 ──
function getRecordSummary() {
  const cards = document.querySelectorAll(".history-card");
  if (cards.length === 0) return null;
  return Array.from(cards).map(card => {
    const lines = card.innerText.split("\n").filter(l => l.trim());
    return lines.join(" / ");
  }).join("\n");
}

// ── AI 버튼들 ──
document.getElementById("analyzeBtn").addEventListener("click", () => {
  const summary = getRecordSummary();
  if (!summary) { alert("먼저 병력을 불러와 주세요."); return; }
  document.getElementById("loadingText").innerText = "병력을 종합 분석 중입니다...";
  askAI(`다음은 환자의 병력 기록입니다:\n${summary}\n\n이 병력을 바탕으로 전반적인 건강 상태를 분석해주세요. 반복되는 질환, 만성 위험 요소, 주의해야 할 점을 정리해주세요.`);
});

document.getElementById("adviceBtn").addEventListener("click", () => {
  const summary = getRecordSummary();
  if (!summary) { alert("먼저 병력을 불러와 주세요."); return; }
  document.getElementById("loadingText").innerText = "건강 관리 조언을 생성 중입니다...";
  askAI(`다음 병력을 가진 환자에게 맞춤 건강 관리 조언을 주세요:\n${summary}\n\n식단, 운동, 생활 습관, 정기 관리 항목 등을 구체적으로 알려주세요.`);
});

document.getElementById("symptomBtn").addEventListener("click", () => {
  const summary = getRecordSummary();
  if (!summary) { alert("먼저 병력을 불러와 주세요."); return; }
  document.getElementById("loadingText").innerText = "증상 주의사항을 분석 중입니다...";
  askAI(`다음 병력을 가진 환자의 증상들을 분석해주세요:\n${summary}\n\n각 증상별로 주의해야 할 점, 악화 신호, 즉시 병원을 방문해야 하는 상황을 알려주세요.`);
});

document.getElementById("checkupBtn").addEventListener("click", () => {
  const summary = getRecordSummary();
  if (!summary) { alert("먼저 병력을 불러와 주세요."); return; }
  document.getElementById("loadingText").innerText = "검진 권고사항을 분석 중입니다...";
  askAI(`다음 병력을 가진 환자에게 권장되는 정기 검진 항목을 알려주세요:\n${summary}\n\n어떤 검사를 얼마나 자주 받아야 하는지 구체적으로 안내해주세요.`);
});

document.getElementById("customBtn").addEventListener("click", () => {
  const q = document.getElementById("customQ").value.trim();
  if (!q) { alert("질문을 입력해주세요."); return; }
  const summary = getRecordSummary();
  document.getElementById("loadingText").innerText = "답변을 생성 중입니다...";
  const prompt = summary
    ? `환자 병력:\n${summary}\n\n질문: ${q}`
    : q;
  askAI(prompt);
  document.getElementById("customQ").value = "";
});

// ── TTS ──
document.getElementById("ttsBtn").addEventListener("click", () => {
  const text = document.getElementById("aiResult").innerText;
  if (!text || text === "AI 분석 결과가 여기에 표시됩니다.") return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ko-KR";
  speechSynthesis.speak(utterance);
});
document.getElementById("stopTtsBtn").addEventListener("click", () => {
  speechSynthesis.cancel();
});

// ── Firebase 유틸 ──
function getLastDate(records) {
  const dates = records.map(r => r.date).filter(d => !!d).sort();
  return dates.length > 0 ? dates[dates.length - 1] : null;
}

async function onLoginSuccess(user) {
  document.getElementById("userInfo").textContent = "로그인됨 : " + user.email;
  document.getElementById("userName").textContent = user.email;
  const userRef = ref(db, "users/" + user.uid);
  const snapshot = await get(userRef);
  const data = snapshot.val() || {};
  const newCount = (data.visitCount || 0) + 1;
  await update(userRef, { visitCount: newCount });
  document.getElementById("visitCount").textContent = newCount + "회";
  const records = data.records ? Object.values(data.records) : [];
  document.getElementById("recentVisit").textContent = getLastDate(records) || "없음";
}

document.getElementById("signupBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!email || !password) { alert("이메일과 비밀번호를 입력해주세요."); return; }
  try {
    const uc = await createUserWithEmailAndPassword(auth, email, password);
    await set(ref(db, "users/" + uc.user.uid), { email, createdAt: new Date().toISOString(), visitCount: 1 });
    alert("회원가입 완료!");
    document.getElementById("userInfo").textContent = "로그인됨 : " + email;
    document.getElementById("userName").textContent = email;
    document.getElementById("visitCount").textContent = "1회";
    document.getElementById("recentVisit").textContent = "없음";
  } catch (e) { alert("회원가입 실패 : " + e.message); }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!email || !password) { alert("이메일과 비밀번호를 입력해주세요."); return; }
  try {
    const uc = await signInWithEmailAndPassword(auth, email, password);
    await onLoginSuccess(uc.user);
    alert("로그인 성공!");
  } catch (e) { alert("로그인 실패 : " + e.message); }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    document.getElementById("userInfo").textContent = "로그인되지 않음";
    document.getElementById("userName").textContent = "사용자 정보";
    document.getElementById("visitCount").textContent = "0회";
    document.getElementById("recentVisit").textContent = "없음";
    document.getElementById("historyList").innerHTML = "";
    document.getElementById("aiResult").innerText = "AI 분석 결과가 여기에 표시됩니다.";
    alert("로그아웃 되었습니다.");
  } catch (e) { alert("로그아웃 실패 : " + e.message); }
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) { alert("로그인 후 병력을 저장할 수 있습니다."); return; }
  const record = {
    disease: document.getElementById("disease").value,
    symptom: document.getElementById("symptom").value,
    date: document.getElementById("date").value,
    prescription: document.getElementById("prescription").value,
    hospital: document.getElementById("hospital").value
  };
  if (!record.disease || !record.date) { alert("병명과 날짜는 필수 입력입니다."); return; }
  try {
    await push(ref(db, "users/" + user.uid + "/records"), record);
    const snap = await get(ref(db, "users/" + user.uid + "/records"));
    const records = snap.val() ? Object.values(snap.val()) : [];
    document.getElementById("recentVisit").textContent = getLastDate(records) || "없음";
    ["date","disease","symptom","prescription","hospital"].forEach(id => document.getElementById(id).value = "");
    alert("병력이 저장되었습니다.");
  } catch (e) { alert("저장 실패 : " + e.message); }
});

document.getElementById("loadBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) { alert("로그인 후 병력을 불러올 수 있습니다."); return; }
  try {
    const snap = await get(ref(db, "users/" + user.uid + "/records"));
    const data = snap.val();
    const records = data ? Object.values(data) : [];
    if (records.length === 0) {
      document.getElementById("historyList").innerHTML = "<p style='color:#6b7280;margin-top:10px;'>등록된 병력이 없습니다.</p>";
      return;
    }
    document.getElementById("historyList").innerHTML = records.map(r => `
      <div class="history-card">
        <h3>${r.disease}</h3>
        <p>📅 발병 시기 : ${r.date}</p>
        <p>🤒 증상 : ${r.symptom}</p>
        <p>💊 처방 : ${r.prescription}</p>
        <p>🏥 병원 : ${r.hospital}</p>
      </div>
    `).join("");
  } catch (e) { alert("불러오기 실패 : " + e.message); }
});
</script>
</body>
</html>

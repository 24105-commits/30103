<script type="module">
// 1. Firebase SDK 라이브러리 로드 (Realtime Database용 변경)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 2. Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyAo_ux68hyhyfbLivMv7FLBHNafo8AEizQ",
  authDomain: "test-7b0db.firebaseapp.com",
  databaseURL: "https://test-7b0db-default-rtdb.firebaseio.com",
  projectId: "test-7b0db",
  storageBucket: "test-7b0db.firebasestorage.app",
  messagingSenderId: "895251219254",
  appId: "1:895251219254:web:1dc67dff22de53642c6997",
  measurementId: "G-JCYBBY8H7T"
};

// 3. Firebase 초기화
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app); // Realtime Database 사용

let currentUser = null;

// 4. 회원 상태 감지 (로그인 여부 확인)
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("userInfo").textContent = "로그인됨 : " + user.email;
    document.getElementById("userName").textContent = user.email;
    loadRecords(); // 로그인 시 자동으로 데이터 불러오기
  } else {
    currentUser = null;
    document.getElementById("userInfo").textContent = "로그인되지 않음";
    document.getElementById("userName").textContent = "사용자 정보";
    document.getElementById("historyList").innerHTML = ""; // 로그아웃 시 목록 비우기
    document.getElementById("visitCount").textContent = "0회";
    document.getElementById("recentVisit").textContent = "없음";
  }
});

// 5. 회원가입 기능
createUserWithEmailAndPassword(auth, email, password)
  .then((userCredential) => {
    console.log("회원가입 성공");
    console.log(userCredential.user);
  })
  .catch((error) => {
    console.log(error.code);
    console.log(error.message);
    alert(error.code);
  });
// 6. 로그인 기능
document.getElementById("loginBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => alert("로그인 성공!"))
    .catch((error) => alert("로그인 실패: " + error.message));
});

// 7. 로그아웃 기능
document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth).then(() => alert("로그아웃 되었습니다."));
});

// 8. 병력 데이터 파이어베이스에 저장하기
document.getElementById("saveBtn").addEventListener("click", () => {
  if (!currentUser) {
    alert("로그인이 필요한 서비스입니다.");
    return;
  }

  // 사용자 UID별로 경로를 생성하여 프라이버시 보호
  const userRecordsRef = ref(db, 'users/' + currentUser.uid + '/records');
  const newRecordRef = push(userRecordsRef); // 고유 키 생성

  const record = {
    date: document.getElementById("date").value,
    disease: document.getElementById("disease").value,
    symptom: document.getElementById("symptom").value,
    prescription: document.getElementById("prescription").value,
    hospital: document.getElementById("hospital").value
  };

  set(newRecordRef, record)
    .then(() => {
      alert("파이어베이스에 병력이 안전하게 저장되었습니다!");
      // 입력창 초기화
      document.getElementById("date").value = "";
      document.getElementById("disease").value = "";
      document.getElementById("symptom").value = "";
      document.getElementById("prescription").value = "";
      document.getElementById("hospital").value = "";
      
      loadRecords(); // 저장 후 목록 갱신
    })
    .catch((error) => alert("저장 실패: " + error.message));
});

// 9. 파이어베이스에서 데이터 불러오기 함수
function loadRecords() {
  if (!currentUser) return;

  const userRecordsRef = ref(db, 'users/' + currentUser.uid + '/records');
  
  get(userRecordsRef).then((snapshot) => {
    let html = "";
    let count = 0;
    let lastDate = "없음";

    if (snapshot.exists()) {
      const data = snapshot.val();
      
      // 파이어베이스 객체를 배열 형태로 변환하여 처리
      Object.keys(data).forEach((key) => {
        const record = data[key];
        count++;
        lastDate = record.date; // 마지막 데이터의 날짜

        html += `
          <div class="history-card">
            <h3>${record.disease}</h3>
            <p>📅 발병 시기 : ${record.date}</p>
            <p>🤒 증상 : ${record.symptom}</p>
            <p>💊 처방 : ${record.prescription}</p>
            <p>🏥 병원 : ${record.hospital}</p>
          </div>
        `;
      });
    } else {
      html = "<p style='padding:15px;'>등록된 병력이 없습니다.</p>";
    }

    document.getElementById("historyList").innerHTML = html;
    document.getElementById("visitCount").textContent = count + "회";
    document.getElementById("recentVisit").textContent = lastDate;
  }).catch((error) => console.error("데이터 로드 실패:", error));
}

// 불러오기 버튼에도 함수 연결
document.getElementById("loadBtn").addEventListener("click", loadRecords);

// 10. AI 분석 기능 (기존 로직 유지)
document.getElementById("analyzeBtn").addEventListener("click", () => {
  const cards = document.querySelectorAll(".history-card h3");
  if (cards.length === 0 || cards[0].innerText === "") {
    document.getElementById("aiResult").innerText = "등록된 병력이 없습니다.";
    return;
  }

  let diseases = [];
  cards.forEach(h3 => diseases.push(h3.innerText));

  let result = `📋 병력 분석 결과\n\n총 병력 수 : ${diseases.length}건\n\n주요 병력 : ${diseases.join(", ")}\n\n💡 건강관리 팁\n- 규칙적인 수면\n- 충분한 수분 섭취\n- 정기 건강검진`;
  document.getElementById("aiResult").innerText = result;
});

// 11. TTS 읽어주기 기능 (기존 로직 유지)
document.getElementById("ttsBtn").addEventListener("click", () => {
  const text = document.getElementById("aiResult").innerText;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ko-KR";
  speechSynthesis.speak(utterance);
});
</script>

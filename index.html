<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 건강기록 관리 시스템</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f5f7fa;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

#aiResult{
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h1>🏥 AI 건강기록 관리 시스템</h1>

<div class="card">
<h2>로그인</h2>

<input type="email" id="email" placeholder="이메일">

<input type="password" id="password" placeholder="비밀번호">

<button onclick="signup()">회원가입</button>
<button onclick="login()">로그인</button>

<p id="userInfo"></p>
</div>

<div class="card">
<h2>내 병력 조회</h2>

<button onclick="loadHistory()">병력 불러오기</button>

<div id="history"></div>
</div>

<div class="card">
<h2>AI 건강 분석</h2>

<button onclick="analyzeHealth()">
AI 분석하기
</button>

<button onclick="speakAI()">
🔊 읽어주기
</button>

<div id="aiResult"></div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo_ux68hyhyfbLivMv7FLBHNafo8AEizQ",
  authDomain: "test-7b0db.firebaseapp.com",
  databaseURL: "https://test-7b0db-default-rtdb.firebaseio.com",
  projectId: "test-7b0db",
  storageBucket: "test-7b0db.firebasestorage.app",
  messagingSenderId: "895251219254",
  appId: "1:895251219254:web:1dc67dff22de53642c6997",
  measurementId: "G-JCYBBY8H7T"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

window.signup = async () => {

try{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("회원가입 성공");

}catch(error){

alert(error.message);

}

};

window.login = async () => {

try{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("로그인 성공");

}catch(error){

alert(error.message);

}

};

onAuthStateChanged(auth,user=>{

if(user){

document.getElementById("userInfo").innerHTML =
"로그인됨 : " + user.email;

}

});

window.loadHistory = async () => {

const user = auth.currentUser;

if(!user){

alert("먼저 로그인하세요");

return;

}

const q = query(
collection(db,"medicalHistory"),
where("uid","==",user.uid)
);

const snapshot = await getDocs(q);

let html = "";

snapshot.forEach(doc=>{

const data = doc.data();

html += `
<div class="card">

<h3>${data.department}</h3>

<p><b>방문일</b> : ${data.date}</p>

<p><b>방문 사유</b> : ${data.reason}</p>

<p><b>처방</b> : ${data.prescription}</p>

</div>
`;

});

document.getElementById("history").innerHTML =
html || "병력 데이터가 없습니다.";

};

window.analyzeHealth = async () => {

const records =
document.getElementById("history").innerText;

if(records.trim()===""){

alert("병력을 먼저 불러오세요");

return;

}

document.getElementById("aiResult").innerText =
"분석 중...";

try{

const response = await fetch(
"https://api.openai.com/v1/chat/completions",
{
method:"POST",

headers:{
"Content-Type":"application/json",

"Authorization":
"Bearer YOUR_OPENAI_API_KEY"
},

body:JSON.stringify({

model:"gpt-4o-mini",

messages:[

{
role:"system",
content:
"너는 건강기록을 요약하고 건강 상태를 분석하는 AI 도우미다."
},

{
role:"user",
content:
records
}

]

})
}
);

const result =
await response.json();

const aiText =
result.choices[0].message.content;

document.getElementById("aiResult").innerText =
aiText;

}catch(error){

document.getElementById("aiResult").innerText =
error.message;

}

};

window.speakAI = () => {

const text =
document.getElementById("aiResult").innerText;

const utterance =
new SpeechSynthesisUtterance(text);

utterance.lang = "ko-KR";

speechSynthesis.speak(utterance);

};

</script>

</body>
</html>

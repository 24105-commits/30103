<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 건강기록 관리 시스템</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#dbeafe,#eff6ff);
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.title{
    text-align:center;
    color:#1e40af;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
    margin-bottom:15px;
    color:#1e3a8a;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #d1d5db;
    border-radius:10px;
}

textarea{
    resize:none;
    height:120px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    margin:5px;
}

button:hover{
    background:#1d4ed8;
}

.btn-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.profile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.info-box{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
}

#historyList{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    margin-top:15px;
}

.history-card{
    background:#f8fafc;
    border-radius:15px;
    padding:15px;
}

#aiResult{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    min-height:100px;
    white-space:pre-wrap;
}

</style>
</head>
<body>

<div class="container">

    <h1 class="title">
        🏥 AI 건강기록 관리 시스템
    </h1>

    <!-- 로그인 -->
    <div class="card">
        <h2>🔐 로그인</h2>
        <input type="email" id="email" placeholder="이메일">
        <input type="password" id="password" placeholder="비밀번호">
        <div class="btn-group">
            <button id="signupBtn">회원가입</button>
            <button id="loginBtn">로그인</button>
            <button id="logoutBtn">로그아웃</button>
        </div>
        <p id="userInfo">로그인되지 않음</p>
    </div>

    <!-- 내 정보 -->
    <div class="card">
        <h2>👤 내 정보</h2>
        <div class="profile-grid">
            <div class="info-box">
                <strong>사용자</strong>
                <p id="userName">사용자 정보</p>
            </div>
            <div class="info-box">
                <strong>총 방문 횟수</strong>
                <p id="visitCount">0회</p>
            </div>
            <div class="info-box">
                <strong>최근 방문일</strong>
                <p id="recentVisit">없음</p>
            </div>
        </div>
    </div>

    <!-- 병력 등록 -->
    <div class="card">
        <h2>➕ 병력 등록</h2>
        <input type="date" id="date">
        <input type="text" id="disease" placeholder="병명">
        <textarea id="symptom" placeholder="증상 입력"></textarea>
        <input type="text" id="prescription" placeholder="처방 내용">
        <input type="text" id="hospital" placeholder="병원명">
        <button id="saveBtn">저장하기</button>
    </div>

    <!-- 병력 목록 -->
    <div class="card">
        <h2>📋 내 병력</h2>
        <button id="loadBtn">병력 불러오기</button>
        <div id="historyList"></div>
    </div>

    <!-- AI 분석 -->
    <div class="card">
        <h2>🤖 AI 건강 분석</h2>
        <button id="analyzeBtn">AI 분석하기</button>
        <button id="ttsBtn">🔊 읽어주기</button>
        <div id="aiResult">AI 분석 결과가 여기에 표시됩니다.</div>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAo_ux68hyhyfbLivMv7FLBHNafo8AEizQ",
  authDomain: "test-7b0db.firebaseapp.com",
  databaseURL: "https://test-7b0db-default-rtdb.firebaseio.com",
  projectId: "test-7b0db",
  storageBucket: "test-7b0db.firebasestorage.app",
  messagingSenderId: "895251219254",
  appId: "1:895251219254:web:1dc67dff22de53642c6997",
  measurementId: "G-JCYBBY8H7T"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

console.log("Firebase 연결 완료");

// ──────────────────────────────
// 공통 유틸: 병력에서 마지막 날짜 계산
// ──────────────────────────────
function getLastDate(records) {
  const dates = records.map(r => r.date).filter(d => !!d).sort();
  return dates.length > 0 ? dates[dates.length - 1] : null;
}

// ──────────────────────────────
// 로그인 성공 시 공통 처리
// ──────────────────────────────
async function onLoginSuccess(user) {
  document.getElementById("userInfo").textContent = "로그인됨 : " + user.email;
  document.getElementById("userName").textContent = user.email;

  const userRef = ref(db, "users/" + user.uid);
  const snapshot = await get(userRef);
  const data = snapshot.val() || {};

  // 방문횟수 +1
  const newCount = (data.visitCount || 0) + 1;
  await update(userRef, { visitCount: newCount });
  document.getElementById("visitCount").textContent = newCount + "회";

  // 병력 기록 중 마지막 날짜
  const records = data.records ? Object.values(data.records) : [];
  const lastDate = getLastDate(records);
  document.getElementById("recentVisit").textContent = lastDate || "없음";
}

// ──────────────────────────────
// 회원가입
// ──────────────────────────────
document.getElementById("signupBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!email || !password) { alert("이메일과 비밀번호를 입력해주세요."); return; }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    await set(ref(db, "users/" + user.uid), {
      email: email,
      createdAt: new Date().toISOString(),
      visitCount: 1
    });
    alert("회원가입 완료! 이메일 : " + email);
    document.getElementById("userInfo").textContent = "로그인됨 : " + email;
    document.getElementById("userName").textContent = email;
    document.getElementById("visitCount").textContent = "1회";
    document.getElementById("recentVisit").textContent = "없음";
  } catch (error) {
    alert("회원가입 실패 : " + error.message);
  }
});

// ──────────────────────────────
// 로그인
// ──────────────────────────────
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (!email || !password) { alert("이메일과 비밀번호를 입력해주세요."); return; }

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    await onLoginSuccess(userCredential.user);
    alert("로그인 성공!");
  } catch (error) {
    alert("로그인 실패 : " + error.message);
  }
});

// ──────────────────────────────
// 로그아웃
// ──────────────────────────────
document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    document.getElementById("userInfo").textContent = "로그인되지 않음";
    document.getElementById("userName").textContent = "사용자 정보";
    document.getElementById("visitCount").textContent = "0회";
    document.getElementById("recentVisit").textContent = "없음";
    document.getElementById("historyList").innerHTML = "";
    document.getElementById("aiResult").innerText = "AI 분석 결과가 여기에 표시됩니다.";
    alert("로그아웃 되었습니다.");
  } catch (error) {
    alert("로그아웃 실패 : " + error.message);
  }
});

// ──────────────────────────────
// 병력 저장
// ──────────────────────────────
document.getElementById("saveBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) { alert("로그인 후 병력을 저장할 수 있습니다."); return; }

  const record = {
    disease: document.getElementById("disease").value,
    symptom: document.getElementById("symptom").value,
    date: document.getElementById("date").value,
    prescription: document.getElementById("prescription").value,
    hospital: document.getElementById("hospital").value
  };
  if (!record.disease || !record.date) { alert("병명과 날짜는 필수 입력입니다."); return; }

  try {
    await push(ref(db, "users/" + user.uid + "/records"), record);

    // 저장 후 마지막 날짜 즉시 갱신
    const snapshot = await get(ref(db, "users/" + user.uid + "/records"));
    const records = snapshot.val() ? Object.values(snapshot.val()) : [];
    const lastDate = getLastDate(records);
    document.getElementById("recentVisit").textContent = lastDate || "없음";

    // 입력창 초기화
    document.getElementById("date").value = "";
    document.getElementById("disease").value = "";
    document.getElementById("symptom").value = "";
    document.getElementById("prescription").value = "";
    document.getElementById("hospital").value = "";

    alert("병력이 저장되었습니다.");
  } catch (error) {
    alert("저장 실패 : " + error.message);
  }
});

// ──────────────────────────────
// 병력 불러오기
// ──────────────────────────────
document.getElementById("loadBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) { alert("로그인 후 병력을 불러올 수 있습니다."); return; }

  try {
    const snapshot = await get(ref(db, "users/" + user.uid + "/records"));
    const data = snapshot.val();
    const records = data ? Object.values(data) : [];

    if (records.length === 0) {
      document.getElementById("historyList").innerHTML = "<p style='color:#6b7280;margin-top:10px;'>등록된 병력이 없습니다.</p>";
      return;
    }

    let html = "";
    records.forEach(r => {
      html += `
        <div class="history-card">
          <h3>${r.disease}</h3>
          <p>📅 발병 시기 : ${r.date}</p>
          <p>🤒 증상 : ${r.symptom}</p>
          <p>💊 처방 : ${r.prescription}</p>
          <p>🏥 병원 : ${r.hospital}</p>
        </div>
      `;
    });
    document.getElementById("historyList").innerHTML = html;
  } catch (error) {
    alert("불러오기 실패 : " + error.message);
  }
});

// ──────────────────────────────
// AI 분석
// ──────────────────────────────
document.getElementById("analyzeBtn").addEventListener("click", () => {
  const cards = document.querySelectorAll(".history-card");
  if (cards.length === 0) {
    document.getElementById("aiResult").innerText = "먼저 병력을 불러와 주세요.";
    return;
  }
  let diseases = [];
  cards.forEach(card => {
    diseases.push(card.querySelector("h3").innerText);
  });
  let result = "";
  result += "📋 병력 분석 결과\n\n";
  result += "총 병력 수 : " + diseases.length + "건\n\n";
  result += "주요 병력 : " + diseases.join(", ") + "\n\n";
  result += "💡 건강관리 팁\n";
  result += "- 규칙적인 수면\n";
  result += "- 충분한 수분 섭취\n";
  result += "- 정기 건강검진";
  document.getElementById("aiResult").innerText = result;
});

// ──────────────────────────────
// TTS
// ──────────────────────────────
document.getElementById("ttsBtn").addEventListener("click", () => {
  const text = document.getElementById("aiResult").innerText;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ko-KR";
  speechSynthesis.speak(utterance);
});

</script>

</body>
</html>
